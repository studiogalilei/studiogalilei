<style>

.brand{display:flex;align-items:center;gap:11px;color:var(--blue);font-size:17px;font-weight:700;letter-spacing:-.4px}.brand svg{width:35px;height:40px;flex:none}.brand.inverse{color:white}

.select-wrap{max-width:480px;margin:auto}.select-wrap .choice-list{display:grid;gap:9px;text-align:left}.role-person{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:9px;padding:17px 19px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px}.role-person:hover{background:#ffffff25}.role-person small{display:block;color:#dfe5ff;margin-top:3px}.entry-back{display:inline-flex;align-items:center;gap:6px;margin-top:25px;background:none;color:white;border:0;text-decoration:underline;text-underline-offset:4px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:25px 13px 16px;gap:33px;background:#fff}.sidebar .brand{padding-left:10px}.caption-side{font-size:11px;font-weight:700;letter-spacing:.04em;margin:0 0 12px 13px;color:var(--blue)}.sidenav{display:grid;gap:6px}.sidenav button{width:100%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:11px;padding:11px 12px;font-weight:600;text-align:left;border-radius:8px}.sidenav button svg{width:19px;height:19px}.sidenav button:hover{background:#eef0fc;color:var(--blue)}.sidenav button.active{background:var(--blue);color:white}.sidefoot{margin-top:auto}.profileline{padding:14px 9px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.avatar{height:35px;width:35px;flex:none;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:700;font-size:13px}.profileline b{display:block;font-size:12px}.profileline small{font-size:11px;color:var(--mid)}.signout{width:100%;background:#fff;border:1px solid var(--line);padding:9px;border-radius:8px;color:var(--ink);font-weight:600}.signout:hover{border-color:var(--blue)}
.main{min-width:0}.top{height:79px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:0 clamp(19px,3vw,45px)}.top h2{font-size:15px;margin:0}.top small{color:var(--mid)}.top .topright{font-size:12px;color:var(--blue);font-weight:700}.container{max-width:1180px;margin:0 auto;padding:33px clamp(18px,3.1vw,45px) 100px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px}.heading h1{font-size:clamp(25px,3vw,32px);line-height:1.17;letter-spacing:-.8px;margin:0 0 6px}.heading p{color:#373b48;margin:0;max-width:780px}.heading .actions{display:flex;gap:8px;flex-wrap:wrap}.eyebrow{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.05em;margin-bottom:8px}

.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:16px}.detailtop{display:flex;justify-content:space-between;gap:18px;margin-bottom:20px;align-items:flex-start}.detailtop h1{margin:4px 0 5px;font-size:clamp(25px,3vw,32px);letter-spacing:-.7px}.detailtop .actions{display:flex;gap:8px;flex-wrap:wrap}.detailmeta{display:flex;flex-wrap:wrap;gap:9px 25px;color:#373b48;font-size:13px}.deadline{font-weight:700;color:var(--blue)}.deadline.late{color:var(--danger)}.detail-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.78fr);gap:20px}.block{border:1px solid var(--line);border-radius:var(--radius);padding:21px;margin-bottom:18px}.block h2{font-size:17px;margin:0 0 16px}.block .block-sub{font-size:12px;color:var(--mid);margin-top:-10px;margin-bottom:16px}.progress{height:7px;border-radius:6px;background:#e7eafd;margin:13px 0 8px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue);transition:width .2s}.small{font-size:12px;color:var(--mid)}.roadmap{margin-top:16px}.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:13px;padding:0 0 20px;position:relative}.step:not(:last-child):before{content:"";position:absolute;left:15px;top:31px;bottom:0;width:1px;background:#ccd2e6}.step-num{height:31px;width:31px;display:grid;place-items:center;border:1px solid #d0d6e8;background:white;color:var(--blue);border-radius:50%;font-weight:700;font-size:12px;z-index:1}.step.done .step-num{background:var(--blue);color:white;border-color:var(--blue)}.step.active .step-num{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 0 0 4px #e9edff}.stepbody{padding-top:3px;min-width:0}.stepbody b{display:block;font-size:14px}.stepbody p{margin:5px 0;color:var(--mid);font-size:13px;white-space:pre-line;overflow-wrap:anywhere}.stepinfo{margin-top:7px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:#414757}.phase-action{border-top:1px solid var(--line);padding-top:16px;display:f .report{padding:14px 0;border-bottom:1px solid var(--line)}.report:first-child{padding-top:0}.report:last-child{border:0;padding-bottom:0}.reporthead{display:flex;align-items:baseline;justify-content:space-between;gap:15px}.reporthead b{font-size:13px}.reporthead time{font-size:11px;color:var(--mid)}.report p{margin:5px 0 9px;white-space:pre-line;overflow-wrap:anywhere;font-size:13px;color:#32343c}.doc-list{display:grid}.doc-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.doc-row:last-child{border:0}.doc-main{min-width:0;flex:1}.doc-main b{display:block;font-size:13px}.doc-main small{display:block;color:var(--mid);font-size:12px}.info-row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}.info-row:last-child{border:0}.info-row small{color:var(--mid);display:block}.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.p-tags span{border:1px solid var(--line);color:var(--blue);padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}

thor:'Paolo Rossi'}]});
const KEY='sg_simple_roadmap_v1';
function getStore(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.projects)&&Array.isArray(x.members)&&Array.isArray(x.partners)&&Array.isArray(x.reports))return x}catch(e){}return seed()}
let store=getStore();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){flash('Impossibile salvare. Lo spazio del browser potrebbe essere pieno.')}};
let ui={role:null,id:null,step:'landing',page:'home',projectId:null,modal:null,filter:''};
const actor=()=>ui.role==='member'?store.members.find(x=>x.id===ui.id):ui.role==='partner'?store.partners.find(x=>x.id===ui.id):{name:'Studio Galilei'};
const member=p=>store.members.find(x=>x.id===p.memberId);
const partner=p=>store.partners.find(x=>x.id===p.partnerId);
const mayEdit=p=>ui.role==='member'&&p.memberId===ui.id;
const projects=()=>store.projects.filter(p=>ui.role==='consultant'||(ui.role==='member'?p.memberId===ui.id:p.partnerId===ui.id));
const reports=()=>store.reports.filter(r=>projects().some(p=>p.id===r.projectId));
const getProject=()=>projects().find(p=>p.id===ui.projectId);
const phase=p=>p.roadmap?(p.roadmap.current>=p.roadmap.steps.length?'Completato':p.roadmap.steps[p.roadmap.current]?.title||'In programma'):'Roadmap da preparare';
const percent=p=>p.roadmap?Math.round(100*p.roadmap.current/p.roadmap.steps.length):0;
const status=p=>!p.roadmap?'Da preparare':p.roadmap.current>=p.roadmap.steps.length?'Completato':'In corso';
const pill=p=>`<span class="status${status(p)==='Completato'?' finished':status(p)==='Da preparare'?' pending':''}">${status(p)}</span>`;
const dateMark=d=>`<span class="deadline${isLate(d)?' late':''}">${niceDate(d)}</span>`;
let toastTimer;
function flash(message){$('#toast').innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{const t=$('#toast');if(t)t.innerHTML=''},3500)}
function landing(){return `<div class="entry"><div>${brand(true)}</div><div class="entry-main">${ui.step==='landing'?`<h1>Un unico spazio per lavorare insieme.</h1><p>Accedi alla tua area Studio Galilei.</p><div class="entry-grid"><button class="entry-choice" data-a="role" data-role="partner">${ico('building')}<b>Area Partner</b><span>La tua azienda, i tuoi progetti.</span><strong>Accedi →</strong></button><button class="entry-choice" data-a="role" data-role="member">${ico('users')}<b>Area Member</b><span>I tuoi incarichi, il tuo lavoro.</span><strong>Accedi →</strong></button></div><button class="consult-link" data-a="role" data-role="consultant">Accedi come consulente</button>`:`<div class="select-wrap"><h1>${ui.step==='partner'?'Area Partner':ui.step==='member'?'Area Member':'Area Consulente'}</h1><p>Seleziona il profilo per entrare.</p><div class="choice-list">${(ui.step==='partner'?store.partners:ui.step==='member'?store.members:[{id:'sg',name:'Studio Galilei'}]).map(x=>`<button class="role-person" data-a="enter" data-id="${esc(x.id)}"><span><b>${esc(x.name)}</b>${x.city?`<small>${esc(x.city)}</small>`:''}</span><span>→</span></button>`).join('')}</div><button class="entry-back" data-a="back-entry">Torna agli accessi</button></div>`}</div><div class="entry-footer">Studio Galilei</div></div>`}
const menus={partner:[['home','Panoramica','home'],['projects','Progetti','folder'],['documents','Documenti','document']],member:[['projects','I miei progetti','folder'],['documents','Materiali','document'],['profile','Profilo','users']],consultant:[['projects','Progetti','folder'],['partners','Partner','building'],['members','Member Club','users']]};
const roleName=()=>ui.role==='partner'?'Area Partner':ui.role==='member'?'Area Member':'Area Consulente';
function layout(content){let nav=menus[ui.role];let label=actor()?.name||'Studio Galilei';return `<div class="shell"><aside class="sidebar">${brand()}<div><div class="caption-side">${roleName()}</div><nav class="sidenav">${nav.map(([page,name,ic])=>`<button data-a="page" data-page="${page}" class="${ui.page===page||(ui.page==='detail'&&page==='projects')?'active':''}">${ico(ic)}${name}</button>`).join('')}</nav></div><div class="sidefoot"><div class="profileline"><span class="avatar">${esc((label||'S').charAt(0))}</span><span><b>${esc(label)}</b><small>${roleName()}</small></span></div><button class="signout" data-a="exit">Esci</button></div></aside><main class="main"><header class="top"><div><h2>${roleName()}</h2><small>Studio Galilei Platform</small></div><div class="topright">${esc(label)}</div></header><div class="container">${content}</div></main></div>`}
const heading=(name,subtitle='',actions='')=>`<div class="heading"><div><h1>${name}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const button=(label,action,cls='')=>`<button class="btn ${cls}" data-a="${action}">${label}</button>`;
const projectRow=p=>`<button class="project-item" data-a="project" data-id="${esc(p.id)}"><span class="miniicon">${ico('folder')}</span><span class="itemmain"><b>${esc(p.title)}</b><small>${ui.role==='partner'?`Member: ${esc(member(p)?.name||'Non assegnato')}`:`${esc(partner(p)?.name||'')} · ${esc(p.service||'Servizio da definire')}`}</small><small>Fase: ${esc(phase(p))}</small></span><span class="itemright">${pill(p)}<small>Scadenza ${niceDate(p.roadmap?.deadline||p.deadline)}</small></span></button>`;
function home(){const ps=projects();let next=ps.filter(p=>status(p)!=='Completato').sort((a,b)=>(a.roadmap?.deadline||a.deadline).localeCompare(b.roadmap?.deadline||b.deadline))[0];return heading('I tuoi progetti','Segui le attività e le prossime consegne.')+`<div class="stats"><div class="stat"><span>Progetti in corso</span><strong>${ps.filter(p=>status(p)==='In corso').length}</strong></div><div class="stat"><span>Da pianificare</span><strong>${ps.filter(p=>!p.roadmap).length}</strong></div><div class="stat"><span>Prossima deadline</span><strong style="font-size:17px">${next?niceDate(next.roadmap?.deadline||next.deadline):'Nessuna'}</strong></div></div><div class="sectionrow"><h2>Progetti</h2><button class="linkbtn" data-a="page" data-page="projects">Vedi tutti</button></div><div class="panel rows">${ps.length?ps.map(projectRow).join(''):'<div class="empty">Nessun progetto assegnato.</div>'}</div>`}
function projectList(){let actions=ui.role==='consultant'?button(`${ico('plus')} Nuovo progetto`,'new-project'):'';return heading(ui.role==='member'?'I miei progetti':'Progetti',ui.role==='partner'?'Vedi fase attuale, avanzamento e scadenze dei lavori.':ui.role==='member'?'Prepara la roadmap, aggiorna le fasi e pubblica i report.':'Progetti e Member assegnati.',actions)+`<div class="panel rows">${projects().length?projects().map(projectRow).join(''):'<div class="empty">Non ci sono ancora progetti.</div>'}</div>`}
function roadmapView(p){const r=p.roadmap;if(!r)return `<div class="empty" style="padding:0">La roadmap non è ancora stata pubblicata.${mayEdit(p)?`<div style="margin-top:13px">${button('Prepara la roadmap','edit-roadmap')}</div>`:''}</div>`;return `<div class="sectionrow"><h2>Roadmap</h2><span class="small">${r.current>=r.steps.length?'Tutte le fasi completate':`Fase ${r.current+1} di ${r.steps.length}`}</span></div><div class="progress" aria-label="Avanzamento ${percent(p)}%"><i style="width:${percent(p)}%"></i></div><div class="small" style="margin-bottom:22px">${percent(p)}% completato</div><div class="roadmap">${r.steps.map((s,i)=>`<div class="step ${i<r.current?'done':i===r.current?'active':''}"><span class="step-num">${i<r.current?ico('check'):i+1}</span><div class="stepbody"><b>${esc(s.title)}</b>${s.note?`<p>${esc(s.note)}</p>`:''}<div class="stepinfo"><span>${i<r.current?'Completata':i===r.current?'In lavorazione':'Da iniziare'}</span><span>Entro ${niceDate(s.due)}</span></div></div></div>`).join('')}</div>${mayEdit(p)?`<div class="phase-action">${r.current<r.steps.length?button(r.current===r.steps.length-1?'Completa il progetto':`${ico('check')} Completa fase`,'complete-phase'):''}${r.current>0?button('Torna alla fase precedente','previous-phase','outline sm'):''}</div>`:''}`}
function reportList(p){const rs=store.reports.filter(r=>r.projectId===p.id).sort((a,b)=>b.at.localeCompare(a.at));return rs.length?rs.map(r=>`<div class="report"><div class="reporthead"><b>${esc(r.title)}</b><time>${niceDate(r.at.slice(0,10))}</time></div>${r.body?`<p>${esc(r.body)}</p>`:''}<div class="small">${esc(r.author)}</div>${r.fileId?`<button class="linkbtn" data-a="download" data-id="${esc(r.fileId)}" data-name="${esc(r.fileName||'documento')}">${ico('download')} Scarica ${esc(r.fileName||'allegato')}</button>`:''}</div>`).join(''):'<div class="empty" style="padding:0">Nessun report pubblicato.</div>'}
function projectDetail(){const p=getProject();if(!p)return projectList();const r=p.roadmap;const can=mayEdit(p);return `<button class="back" data-a="page" data-page="projects">← Torna ai progetti</button><div class="detailtop"><div><div class="eyebrow">${esc(partner(p)?.name||'Partner')}</div><h1>${esc(p.title)}</h1><div class="detailmeta"><span>Member: <b>${esc(member(p)?.name||'Non assegnato')}</b></span><span>Servizio: <b>${esc(r?.service||p.service||'Da definire')}</b></span><span>Deadline: ${dateMark(r?.deadline||p.deadline)}</span></div></div><div class="actions">${can?button(`${ico('edit')} ${r?'Modifica roadmap':'Crea roadmap'}`,'edit-roadmap','outline')+button(`${ico('plus')} Pubblica report`,'new-report'):''}</div></div><div class="detail-layout"><div><section class="block">${roadmapView(p)}</section><section class="block"><div class="sectionrow"><h2>Report e aggiornamenti</h2>${can?`<button class="linkbtn" data-a="new-report">Aggiungi</button>`:''}</div>${reportList(p)}</section></div><aside><section class="block"><h2>Riepilogo</h2><div class="info-row"><span>Stato</span>${pill(p)}</div><div class="info-row"><span>Fase attuale</span><b style="text-align:right;max-width:160px">${esc(phase(p))}</b></div><div class="info-row"><span>Scadenza finale</span>${dateMark(r?.deadline||p.deadline)}</div><div class="info-row"><span>Avanzamento</span><b>${percent(p)}%</b></div></section>${can&&p.draft?`<section class="block"><h2>Bozza salvata</h2><p class="small">Hai modifiche alla roadmap non ancora inviate al Partner.</p>${button('Riprendi la bozza','edit-roadmap','outline')}</section>`:''}<section class="block"><h2>Referenti</h2><div style="font-weight:700">${esc(member(p)?.name||'Da assegnare')}</div><div class="small">Member incaricato</div><div style="font-weight:700;margin-top:17px">Studio Galilei</div><div class="small">Consulente responsabile</div></section></aside></div>`}
function documents(){const rows=reports().filter(r=>r.fileId||r.body).sort((a,b)=>b.at.localeCompare(a.at));return heading(ui.role==='member'?'Materiali':'Documenti',ui.role==='partner'?'Report e documenti condivisi sui tuoi progetti.':'Materiali pubblicati nei progetti assegnati.')+`<div class="panel pad doc-list">${rows.length?rows.map(r=>{let p=store.projects.find(x=>x.id===r.projectId);return `<div class="doc-row"><span class="miniicon">${ico('document')}</span><span class="doc-main"><b>${esc(r.title)}</b><small>${esc(p?.title||'')} · ${niceDate(r.at.slice(0,10))}</small></span>${r.fileId?`<button class="btn outline sm" data-a="download" data-id="${esc(r.fileId)}" data-name="${esc(r.fileName)}">Scarica</button>`:`<button class="btn outline sm" data-a="project" data-id="${esc(r.projectId)}">Apri</button>`}</div>`}).join(''):'<div class="empty">Nessun materiale condiviso.</div>'}</div>`}
function memberProfile(){const m=actor();return heading('Il tuo profilo','Le informazioni professionali visibili ai Partner assegnati.',button(`${ico('edit')} Modifica`,'edit-profile','outline'))+`<div class="panel pad" style="max-width:650px"><div style="display:flex;gap:14px;align-items:center"><div class="avatar" style="height:50px;width:50px;font-size:18px">${esc(m.name.charAt(0))}</div><div><h2 style="margin:0">${esc(m.name)}</h2><div class="small">Member Studio Galilei · ${esc(m.city)}</div></div></div><div class="p-tags">${m.skills.map(s=>`<span>${esc(s)}</span>`).join('')}</div><p style="margin:24px 0 0;max-width:65ch">${esc(m.bio||'')}</p></div>`}
function partnersView(){return heading('Partner','Le aziende che collaborano con Studio Galilei.',button(`${ico('plus')} Nuovo Partner`,'new-partner'))+`<div class="panel pad">${store.partners.map(p=>`<div class="info-row"><div><b>${esc(p.name)}</b><small>${store.projects.filter(x=>x.partnerId===p.id).length} progetti</small></div></div>`).join('')}</div>`}
function membersView(){return heading('Member Club','Professionisti e competenze approvate.',button(`${ico('plus')} Nuovo Member`,'new-member'))+`<div class="panel pad">${store.members.map(m=>`<div class="info-row"><div><b>${esc(m.name)}</b><small>${esc(m.skills.join(' · '))} · ${esc(m.city)}</small></div><span class="small">${store.projects.filter(x=>x.memberId===m.id).length} incarichi</span></div>`).join('')}</div>`}
function render(){if(!ui.role){$('#app').innerHTML=landing();$('#portal').innerHTML='';return}let content=ui.page==='detail'?projectDetail():ui.page==='home'?home():ui.page==='projects'?projectList():ui.page==='documents'?documents():ui.page==='profile'?memberProfile():ui.page==='partners'?partnersView():ui.page==='members'?membersView():projectList();$('#app').innerHTML=layout(content);$('#portal').innerHTML=ui.modal?modalView():''}
function showModal(type){ui.modal={type};render()}
function closeModal(){ui.modal=null;$('#portal').innerHTML=''}
function field(label,name,value='',type='text',required=false){return `<div class="field-group"><label for="${name}">${label}</label><input class="field" type="${type}" id="${name}" name="${name}" value="${esc(value)}" ${required?'required':''}></div>`}
function selectField(label,name,opts,selected=''){return `<div class="field-group"><label for="${name}">${label}</label><select class="field" name="${name}" id="${name}">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===selected?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>`}
function modalView(){let {type}=ui.modal;let title='',html='';const p=getProject();if(type==='roadmap'&&p){title='Roadmap del progetto';const m=member(p),draft=p.draft||p.roadmap||{service:m?.skills?.[0]||'',deadline:p.deadline,steps:[{id:makeId('step'),title:'',due:p.deadline,note:''},{id:makeId('step'),title:'',due:p.deadline,note:''}]};html=`<form id="roadmap-form"><div class="note">Seleziona il servizio che eroghi, definisci le fasi e invia la roadmap. Il Partner vedrà sempre la fase attuale e la deadline.</div>${selectField('Servizio da erogare','service',(m?.skills||[]).map(s=>({id:s,name:s})),draft.service)}${field('Scadenza finale','deadline',draft.deadline,'date',true)}<div class="sectionrow"><h2>Touchpoint</h2><button type="button" class="btn outline sm" data-a="add-step">${ico('plus')} Aggiungi fase</button></div><div id="step-editor">${draft.steps.map((s,i)=>stepEditor(s,i)).join('')}</div><div class="modal-foot"><button type="button" class="btn neutral" data-a="close">Annulla</button><button class="btn outline" type="submit" name="intent" value="draft">Salva bozza</button><button class="btn" type="submit" name="intent" value="send">Invia al Partner</button></div></form>`}
else if(type==='report'&&p){title='Pubblica report';html=`<form id="report-form">${field('Titolo','title','','text',true)}<div class="field-group"><label for="body">Aggiornamento</label><textarea id="body" name="body" class="field" placeholder="Descrivi ciò che è stato fatto o i risultati da condividere..."></textarea></div><div class="field-group"><label for="file">Allegato (facoltativo)</label><input class="field" type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xlsx,.csv,.txt"><p class="help">Massimo 15 MB. Il file sarà visibile al Partner.</p></div><div class="modal-foot"><button type="button" class="btn neutral" data-a="close">Annulla</button><button type="submit" class="btn">Pubblica</button></div></form>`}
else if(type==='project'){title='Nuovo progetto';html=`<form id="new-project-form">${field('Nome del progetto','title','','text',true)}${selectField('Partner','partner',store.partners.map(p=>({id:p.id,name:p.name})))}${selectField('Member incaricato','member',store.members.map(m=>({id:m.id,name:m.name})))}${field('Deadline del progetto','deadline','','date',true)}<p class="note">Il Member selezionerà il servizio tra le proprie competenze e preparerà la roadmap da inviare al Partner.</p><div class="modal-foot"><button class="btn neutral" type="button" data-a="close">Annulla</button><button class="btn" type="submit">Crea progetto</button></div></form>`}
else if(type==='partner'){title='Nuovo Partner';html=`<form id="new-partner-form">${field('Ragione sociale','name','','text',true)}${field('Sito web','website','','url')}<div class="modal-foot"><button class="btn neutral" type="button" data-a="close">Annulla</button><button class="btn" type="submit">Aggiungi Partner</button></div></form>`}
else if(type==='member'){title='Nuovo Member';html=`<form id="new-member-form">${field('Nome e cognome','name','','text',true)}${field('Città','city','','text',true)}${field('Competenze approvate (separate da virgola)','skills','','text',true)}<p class="small">Le competenze determinano quali servizi il Member potrà selezionare nelle roadmap.</p><div class="modal-foot"><button class="btn neutral" type="button" data-a="close">Annulla</button><button class="btn" type="submit">Aggiungi Member</button></div></form>`}
else if(type==='profile'){title='Modifica profilo';html=`<form id="profile-form"><div class="field-group"><label for="bio">Presentazione professionale</label><textarea class="field" id="bio" name="bio" required>${esc(actor().bio)}</textarea></div><div class="modal-foot"><button class="btn neutral" type="button" data-a="close">Annulla</button><button class="btn" type="submit">Salva</button></div></form>`}
return `<div class="overlay" data-a="overlay"><div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="xbtn" type="button" data-a="close" aria-label="Chiudi">×</button></div>${html}</div></div>`}
function stepEditor(s,i){return `<div class="step-edit" data-step-id="${esc(s.id||makeId('step'))}"><div class="step-edit-header"><b>Fase ${i+1}</b><button data-a="remove-step" type="button">Rimuovi</button></div><div class="form-grid"><div class="field-group"><label>Nome fase</label><input class="field" name="step-title" value="${esc(s.title)}" required placeholder="Es. Attivazione campagne"></div><div class="field-group"><label>Scadenza fase</label><input class="field" type="date" name="step-due" value="${esc(s.due||'')}" required></div></div><div class="field-group" style="margin-bottom:0"><label>Nota (facoltativa)</label><textarea name="step-note" class="field" style="min-height:65px" placeholder="Cosa succede in questa fase">${esc(s.note||'')}</textarea></div></div>`}
function collectRoadmap(form,p){let service=form.elements.service.value,deadline=form.elements.deadline.value,m=member(p);if(!m||!m.skills.includes(service))throw Error('Seleziona un servizio tra le competenze del Member.');if(!deadline)throw Error('Indica la scadenza finale.');let els=[...$('#step-editor').querySelectorAll('.step-edit')];if(!els.length)throw Error('Inserisci almeno una fase.');let steps=els.map(el=>({id:el.dataset.stepId,title:el.querySelector('[name="step-title"]').value.trim(),due:el.querySelector('[name="step-due"]').value,note:el.querySelector('[name="step-note"]').value.trim()}));if(steps.some(s=>!s.title||!s.due))throw Error('Completa nome e scadenza di ogni fase.');if(steps.some(s=>s.due>deadline))throw Error('La scadenza di una fase non può superare la deadline finale.');if(steps.some((s,i)=>i>0&&s.due<steps[i-1].due))throw Error('Le scadenze delle fasi devono essere in ordine cronologico.');return {service,deadline,steps,current:Math.min(p.roadmap?.current||0,steps.length),sentAt:p.roadmap?.sentAt||null}}
let idb=null;async function fileDB(){if(idb)return idb;idb=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('Archivio file non disponibile.'));return}const request=indexedDB.open('sg_platform_files_v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});return idb}
async function putFile(key,file){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function fetchFile(key){const db=await fileDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function downloadFile(key,name){try{let f=await fetchFile(key);if(!f)throw Error();const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name||'documento';a.click();setTimeout(()=>URL.revokeObjectURL(u),8000)}catch(e){flash('File non disponibile su questo browser.')}}
function enter(role,id){ui={role,id,page:role==='partner'?'home':'projects',step:'landing',projectId:null,modal:null,filter:''};render()}
function goto(page){ui.page=page;ui.projectId=null;ui.modal=null;render();window.scrollTo(0,0)}
function openProject(id){if(!projects().find(x=>x.id===id))return;ui.projectId=id;ui.page='detail';render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const btn=e.target.closest('[data-a]');if(!btn)return;const a=btn.dataset.a;
if(a==='overlay'){if(e.target===btn)closeModal();return}
if(a==='role'){ui.step=btn.dataset.role;render();return}
if(a==='back-entry'){ui.step='landing';render();return}
if(a==='enter'){enter(ui.step,btn.dataset.id);return}
if(a==='exit'){ui={role:null,id:null,step:'landing',page:'home',projectId:null,modal:null,filter:''};render();return}
if(a==='page'){goto(btn.dataset.page);return}
if(a==='project'){openProject(btn.dataset.id);return}
if(a==='close'){closeModal();return}
if(a==='edit-roadmap'&&mayEdit(getProject())){showModal('roadmap');return}
if(a==='new-report'&&mayEdit(getProject())){showModal('report');return}
if(a==='new-project'&&ui.role==='consultant'){showModal('project');return}
if(a==='new-partner'&&ui.role==='consultant'){showModal('partner');return}
if(a==='new-member'&&ui.role==='consultant'){showModal('member');return}
if(a==='edit-profile'&&ui.role==='member'){showModal('profile');return}
if(a==='add-step'){const holder=$('#step-editor');if(holder.children.length>=15)return flash('Massimo 15 fasi per roadmap.');holder.insertAdjacentHTML('beforeend',stepEditor({id:makeId('step'),title:'',due:getProject()?.deadline||'',note:''},holder.children.length));return}
if(a==='remove-step'){const holder=$('#step-editor');if(holder.children.length<=1)return flash('La roadmap deve contenere almeno una fase.');btn.closest('.step-edit').remove();[...holder.children].forEach((el,i)=>el.querySelector('.step-edit-header b').textContent='Fase '+(i+1));return}
if(a==='complete-phase'&&mayEdit(getProject())){let p=getProject();if(!p.roadmap||p.roadmap.current>=p.roadmap.steps.length)return;p.roadmap.current++;save();render();flash(p.roadmap.current>=p.roadmap.steps.length?'Progetto completato.':'Fase completata. Il Partner vede ora la fase successiva.');return}
if(a==='previous-phase'&&mayEdit(getProject())){let p=getProject();if(!p.roadmap||p.roadmap.current===0)return;p.roadmap.current--;save();render();flash('Fase precedente ripristinata.');return}
if(a==='download'){await downloadFile(btn.dataset.id,btn.dataset.name);return}
});
document.addEventListener('submit',async e=>{const form=e.target;if(!form.id.endsWith('-form'))return;e.preventDefault();const fd=new FormData(form);
try{
if(form.id==='roadmap-form'){let p=getProject();if(!mayEdit(p))return;const road=collectRoadmap(form,p);const submitter=e.submitter;const intent=submitter?.value||'draft';if(intent==='send'){road.sentAt=timestamp();p.roadmap=road;p.draft=null;p.service=road.service;p.deadline=road.deadline}else p.draft=road;save();closeModal();render();flash(intent==='send'?'Roadmap inviata al Partner.':'Bozza della roadmap salvata.');return}
if(form.id==='report-form'){let p=getProject();if(!mayEdit(p))return;let title=String(fd.get('title')||'').trim(),body=String(fd.get('body')||'').trim(),file=fd.get('file');if(!title||(!body&&(!file||!file.size)))throw Error('Inserisci un aggiornamento oppure allega un documento.');let fileId=null,fileName=null;if(file&&file.size){if(file.size>15*1024*1024)throw Error('File troppo grande. Massimo 15 MB.');fileId=makeId('file');fileName=file.name;await putFile(fileId,file)}store.reports.unshift({id:makeId('report'),projectId:p.id,title,body,at:timestamp(),fileId,fileName,author:actor()?.name||'Member'});save();closeModal();render();flash('Report pubblicato e visibile al Partner.');return}
if(form.id==='new-project-form'){if(ui.role!=='consultant')return;let title=String(fd.get('title')||'').trim(),deadline=String(fd.get('deadline')||''),partnerId=String(fd.get('partner')||''),memberId=String(fd.get('member')||'');if(!title||!deadline||!store.partners.some(p=>p.id===partnerId)||!store.members.some(m=>m.id===memberId))throw Error('Compila tutti i campi.');const p={id:makeId('project'),title,partnerId,memberId,deadline,service:'',roadmap:null,draft:null,createdAt:timestamp()};store.projects.unshift(p);save();closeModal();openProject(p.id);flash('Progetto creato. Il Member può preparare la roadmap.');return}
if(form.id==='new-partner-form'){if(ui.role!=='consultant')return;let name=String(fd.get('name')||'').trim();if(!name)throw Error('Inserisci la ragione sociale.');store.partners.push({id:makeId('partner'),name,website:String(fd.get('website')||'')});save();closeModal();render();flash('Partner aggiunto.');return}
if(form.id==='new-member-form'){if(ui.role!=='consultant')return;let name=String(fd.get('name')||'').trim(),city=String(fd.get('city')||'').trim(),skills=String(fd.get('skills')||'').split(',').map(x=>x.trim()).filter(Boolean);skills=[...new Set(skills)];if(!name||!city||!skills.length)throw Error('Inserisci nome, città e almeno una competenza.');store.members.push({id:makeId('member'),name,city,skills,bio:''});save();closeModal();render();flash('Member aggiunto.');return}
if(form.id==='profile-form'){if(ui.role!=='member')return;actor().bio=String(fd.get('bio')||'').trim();save();closeModal();render();flash('Profilo salvato.');return}
}catch(err){flash(err.message||'Operazione non riuscita.')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script></body></html>
